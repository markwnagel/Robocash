# Backtest figures dated 2026-09-12 in the comments below were measured on a universe that no longer
# exists and do not reproduce (that baseline, +247%, re-runs at +143.8% on the frozen snapshot). Treat
# them as directional; see README "Reproducible backtests". Figures dated 2026-09-24 are reproducible.
# All backtest figures in these comments come from the survivor-list universe (today's 800 names). The
# point-in-time study (robustness.py, 2018-2026, delisted names included) reverses several of them - e.g.
# 15 target positions and regime.off_liquidate both beat this config there on return. See README "Point-in-time
# robustness study" before changing a setting on the strength of a comment below.
# Re-baseline 2026-10-17 (scripts/check_rebaseline.py; rule fixed before the run: six-month excess over SPY better
# in >=3/4 starts in both windows, median drawdown no worse in either). Median of 4 starts, 2018-26 / 2023-26:
#   today              excess -4.3 / +3.7pt   max DD -32.1% / -18.7%
#   15 positions       excess -3.7 / +4.5pt   (better 2/4, 3/4)   max DD -32.4% / -20.4%   CAGR better 4/4, 3/4
#   off_liquidate      excess -4.4 / +3.4pt   (2/4, 0/4)          max DD -22.5% / -16.1%   (better 4/4 both)
#   both               excess -5.5 / -0.1pt   (0/4, 0/4)          max DD -26.3% / -17.2%
# None passes; today's config stays. 15 positions is the near miss (return, not excess, and a slightly deeper
# drawdown); off_liquidate cuts drawdown by a third in 2018-26 without beating SPY - a risk choice, not edge.
# v2.1 "slow and wide" (quant review 2026-11-01, scripts/check_quant_review_1101.py; state/robustness/2026-11-01-quant*).
# Six changes as one variant, tested together: 12-month momentum, stop 4x ATR, no target, decay rank 80, hold
# 21-126 days, 20 names at a 7% cap. Point-in-time, delistings in; six-month excess vs SPY, median per start:
#                       2018-26                         2023-26
#   v2.0 (4 starts)     -4.3pt  p10 -16.4  DD -32.1%    +3.7pt  p10 -12.9  DD -18.7%
#   v2.1 (4 starts)     -1.4pt (4/4) p10 3/4 DD -33.7%  +7.3pt (2/4) p10 3/4 DD -19.6%
#   12 monthly starts   better 12/12, p10 10/12         better 7/12, p10 6/12
#   live frictions*     -1.9 vs -6.1pt (4/4) p10 4/4    +5.2 vs +0.5pt (3/4) p10 3/4  (*42% half-sized, 10% removed,
#                                                                                       5 paired seeds)
#   with the SPY sweep  +0.8pt (12/12) p10 12/12        +8.8pt (11/12) p10 9/12   - passes everywhere; vs SPMO
#                       -0.9 / +1.2pt (v2.0: -7.6 / -4.3pt)
# Clears the owner's bar under live frictions and with the sweep; in the frictionless 12-start stagger the
# 2023-26 window is 7/12. Mostly edge, not exposure: invested 70% -> 75%, trades 191 -> 170/yr, CAGR +6pt.
# Rejected in the same review (more risk inside the old design loses): kill switch 25% or off, 15% cap with
# 1.25%/1.5% risk (2018-26 DD -49%), decay 80 alone, slow exits with the 6-month lookback, risk_off_scale 1.0,
# an SPMO-like large-cap book (p10 -19 vs -16 in 2018-26), idle cash into SPMO.
release:                       # the strategy version results are reported under (README "Releases")
  name: v2.1                   # git tag v2.1 (slow and wide, above). v2.0 = 2026-10-16..10-30; v1.0 = 9f13ae6
  since: 2026-10-30            # the last v2.0 close. If the first v2.1 run is later than 2026-11-02, set this to
                               # the last close before it. v2.0 = since 2026-10-16, first run 2026-10-19.
                               # Reports show "since v2.0" beside "since inception"; the kill switch, high-water
                               # mark and cumulative floor stay continuous - a release never resets a risk limit.
                               # Positions held at the cut are labelled v1.0 (carried) in the trade log.
account:
  paper: true
  starting_capital: 10000

data:
  feed: sip            # free tier gets SIP historical after a 15-min delay; falls back to iex on 403
  history_days: 300
  cache_dir: state/cache
  cache_retention_days: 2   # bar panels older than this are deleted after each fetch. Their filename
                            # carries the fetch date and only today's is ever read, so nothing reachable
                            # is lost; 0 disables pruning. Fact sheets and EDGAR data are never touched.

universe:
  exchanges: [NYSE, NASDAQ]
  min_price: 5.0
  min_avg_dollar_volume: 20000000   # 20-day average, USD. Backtested 2026-09-12 (3y): $5M / 1500 names
  max_symbols: 800                  # = +53% / Sharpe 0.74 vs +247% / 1.78 here. Thin names win the momentum
                                    # ranking and lose the trade (more gaps, smaller wins). Keep.
  refresh_days: 7
  exclude_name_keywords: [ETF, ETN, Fund, Trust, Warrant, Preferred, Acquisition, Rights, Units, Depositary Shares]

signals:
  momentum_lookback_days: 252   # v2.1 (was 126). 252 alone lost (2026-10-27); it wins with the slow exits below
  momentum_skip_days: 21
  short_lookback_days: 20
  trend_ma_days: 50
  atr_days: 14
  vol_days: 20
  weights:
    momentum: 0.6
    short: 0.2              # 2026-10-24 audit proposal (entries after a +20% 20-day move averaged -6.9% vs -3.7%,
                            # n=10): short 0.15 and 0.10, the rest to low_vol, point-in-time x4 starts
                            # (scripts/check_audit_1024.py): worse on return and on 6m excess vs SPY in 0/4 starts
                            # in BOTH windows (2023-26 6m excess -6.4 / -4.2 vs +3.7pt). Kept 0.2.
    low_vol: 0.2
  max_atr_pct: 0.08       # skip names whose 14-day ATR exceeds 8% of price

portfolio:
  sizing: risk_parity       # risk_parity: stop distance sets share count | notional: equity/target_positions
  risk_per_trade_pct: 0.01  # risk_parity only: fraction of equity lost if the stop fills exactly
                            # 1.25% tested 2026-09-24 (--stagger 6): beat 1% on return in 6/6 windows,
                            # median +34.8 pts, drawdown 4/6. NOT adopted: avg position only 7.6 -> 7.8%,
                            # part of the edge is kill-switch timing, and 12 x 1.25% = 15% open risk.
  min_shares_per_position: 1  # >1 rejects names whose lot rounds too small to carry the intended risk.
                              # 3 would cap buyable price at ~$333 on $10k (audit 2026-09-12); backtest first.
  target_positions: 20      # v2.1 (was 12; see release). 15 tested 2026-09-24 (--stagger 6): lost on return in 4/6 windows, median
                            # -15.9 pts - the same cash spread across more, smaller positions (fast exits).
  max_positions: 25           # v2.1 (was 15)
  max_position_pct: 0.07      # v2.1 (was 0.10). Cap at ENTRY. A winner can drift above it; that is a note, not an action, until:
  trim_above_pct: 0.15        # a holding at or above this share of equity is trimmed automatically - sold at the
  trim_to_pct: 0.10           # next open back to this share, its stop re-placed for the rest (owner's rule,
                              # 2026-09-29; replaced a daily MANUAL ACTION at 10%). 0 turns trimming off. Keep above
                              # regime.strong_max_position_pct, or a laddered entry would be trimmed on day one.
  cash_floor_pct: 0.05
  cash_sweep:                 # backtest only so far: idle cash above the floor and staged orders held in SPY
    enabled: false            # (backtest.py; scripts/check_cash_sweep.py). Not implemented live.
    band_pct: 0.02            # rebalance only when the sweep is off by more than this share of equity
    # 2026-10-17 point-in-time, 4 starts, sweep (2% band) vs today:
    #   2018-26 CAGR 9.5% vs 5.0% (better 3/4), 6m excess vs SPY -2.9 vs -4.3pt (better 2/4), max DD -30.7% vs -32.1%
    #   2023-26 CAGR 19.0% vs 18.9% (better 2/4), 6m excess +4.9 vs +3.7pt (better 3/4), max DD -22.3% vs -18.7% (0/4)
    # Closer to SPY in both windows, mostly by adding exposure, not edge: invested 70-77% -> 79-81%, and the 2023-26
    # drawdown is deeper in every start. Misses the >=3/4 return bar in 2023-26. A 5% band was no better.
    # Owner's decision 2026-10-17: not built live. reduce_factor 1.0 and offering_block false (both from 10-19)
    # should cut idle cash on their own. Revisit ~2026-11-06: if live cash still averages over ~25%, build it.
    # 2026-11-01 at live cash levels (scripts/check_cash_sweep_live.py; live frictions: half-size 42%, REMOVE 10%;
    # 5 paired seeds x 4 starts per window, median per start). Idle cash ~32-37%, near live's 35-45%:
    #   2018-26 CAGR 4.5% vs 2.4% (better 4/4), 6m excess vs SPY -4.5 vs -5.7pt (better 4/4), p10 no worse 4/4,
    #           max DD -31.6% vs -31.6% (better 1/4); paired seeds better 16/20
    #   2023-26 CAGR 17.1% vs 14.3% (better 4/4), 6m excess +2.8 vs +0.7pt (better 4/4), p10 no worse 4/4,
    #           max DD -22.8% vs -17.9% (better 0/4); paired seeds better 18/20
    # Clears the owner's bar in both windows at live cash, which the 10-17 run did not. Still exposure, not
    # edge (invested 63-68% -> 77-83%), and 2023-26 drawdown ~5pt deeper. Decision for 2026-11-06.
  max_new_entries_per_day: 4  # spreads entry timing. Backtested 2026-09-12 (3y): unlimited = +104%/DD -27.7%
                              # with six hard-floor hits vs +247%/-20.5% at 4/day - batch entries share one
                              # day's gap risk and trip the kill switch together. Keep.
  pyramid_max_adds: 0         # >0: add up to this many units to a winner (Turtle-style). Backtested 2026-09-12:
                              # 2 adds on a 2xATR trail = +115% vs +247% base; adds got shaken out on the same
                              # pullbacks as the trail. OFF.
  pyramid_trigger_r: 1.0      # add when price >= last entry + this many initial-risk units
  correlation_days: 60         # 120 tested 2026-10-24 (audit proposal: three refiners held together), point-in-time
                               # x4: 2023-26 better in 4/4 (6m excess +4.9 vs +3.7pt, p10 no worse 4/4, DD no worse
                               # 3/4); 2018-26 better in only 2/4 (-4.0 vs -4.3pt, DD no worse 2/4), invested and
                               # trades unchanged. Fails the owner's 3/4-in-both-windows bar. Kept 60; recheck in
                               # the next re-baseline rather than re-running it alone.
  correlation_threshold: 0.75  # 0.70 and 0.65 tested 2026-10-03 (audit proposal; state/robustness/2026-10-03-audit):
                               # frozen 800 x6 starts: return +8-10pt median, drawdown unchanged. Point-in-time
                               # 2023-26 x4: return worse (0.70 in 3/4, 0.65 in 4/4); 2018-26 x4: mixed. Kept 0.75
  max_correlated_peers: 1     # 0 was backtested 2026-09-12: worse return AND worse drawdown (momentum
                              # leaders share a theme; blocking them reaches down to worse names)
  vol_weighting: true       # notional sizing only

exits:
  stop_atr_multiple: 4.0         # v2.1 (was 2.0; see release): a stop for a broken trend, not for noise. 2.5 alone
                                 # (below) lost; 4x wins only with the slower exits and lookback. 2.5 proposed by the 2026-10-10 audit (7 of 8 live exits were stops, ~9-day hold).
                                 # Already tested: point-in-time 2018-26, 4 starts (state/robustness/2026-09-24):
                                 # 2.5 = 3.0%/yr median vs 4.9%, worse return in 4/4, drawdown better in 3/4;
                                 # 1.5 worse on both. Fails the audit's own bar (return better in >=3/4). Kept.
                                 # 2026-10-13 (scripts/check_stop_variants.py, state/robustness/2026-10-13-stops),
                                 # after 5 of 7 live stop-outs rebounded. Median CAGR vs today, point-in-time
                                 # full 2018-26 / recent 2023-26 (return better in n of 4 starts):
                                 #   2.5 with a 2.4R target (same 6x ATR target): 2.3% vs 4.9% (0/4), 15.0% vs 18.9% (0/4)
                                 #   stop judged on the close, sold next open: 5.2% vs 4.9% (2/4), 13.2% vs 18.9% (0/4)
                                 #   the same + a 3x ATR resting stop: 3.4% (1/4), 11.3% (0/4)
                                 # The close rule cuts stop-outs from ~43% to ~27% of trades and lifts the win rate,
                                 # but the stops it does take lose ~2 points more each. All fail the bar. Kept.
                                 # Anchor (2026-10-17 audit): live measures the bracket from the signal-day close
                                 # (desk/portfolio.py _bracket), the backtest from the fill, so an entry that opens
                                 # low gets a nearer stop (NTAP/FTNT/OKTA at 74-83% of 2x ATR). Point-in-time, 4
                                 # starts: fill-anchored beats signal-anchored on return in 3/4 starts in both
                                 # windows (4.9% vs 4.4%/yr; 18.9% vs 16.0%), drawdown about equal. Live not changed
                                 # yet: it needs the bracket re-set from the fill (scripts/check_audit_1017.py).
  # No re-entry cooldown. The 2026-10-10 audit proposed 5 trading days after TXG was re-bought the morning after
  # its target fill and stopped out (-$37). In the backtests the trades a cooldown would block are better than
  # average: re-buys within 5 trading days of an exit averaged +0.91% vs +0.66% for all trades (247 of 1,667,
  # $2,050 of $7,919 profit) point-in-time 2018-26, and +1.84% vs +1.56% on the frozen 800. The audit's bar was
  # a blocked set with negative mean P&L. Rejected. (Counts blocked trades; not a re-run with the slots refilled.)
  take_profit_r_multiple: 0.0    # v2.1 (was 3.0): no take-profit leg; winners run until decay or max hold
  trail_atr_multiple: 0          # >0: each evening raise the stop to (highest close since entry - this x ATR),
                                 # never lower, and replace the broker-side stop. Backtested 2026-09-12 (3y):
                                 # 2x = +130%, 3x = +141% vs +247% with the 3R target - a trail exits on
                                 # routine pullbacks at ~+9% where the target limit fills the spike at ~+14%.
                                 # OFF. (v2.0 note: the 3R target was the exit that worked with 2x stops and
                                 # 60-day holds. v2.1 drops the target; exits are the 4x stop, decay and max hold.)
  min_hold_days: 21          # v2.1 (was 15)
  max_hold_days: 126         # v2.1 (was 60)
  signal_decay_rank: 80      # v2.1 (was 40; see release). After min_hold, exit if the name's rank falls beyond this.
                             # 80 alone lost (2026-11-01: 0/4 both windows); it works only inside v2.1.
                             # 2026-10-17 audit proposed 25 (5 of 5 live decay exits lost, avg -8.2% at 26 days).
                             # Point-in-time 2018-26 / 2023-26, 4 starts (scripts/check_audit_1017.py): 20, 25 and
                             # 30 all worse on return in 0/4 starts in both windows (25: 3.6% vs 5.0%/yr, 11.7% vs
                             # 18.9%), drawdown mostly worse. Backtest decay exits average +2%; the live losses are
                             # the 10-13..10-16 unwind. Kept.
  earnings_exit_days_before: 0   # >0: close a holding this many days before its confirmed earnings date,
                                 # overriding min_hold_days. OFF (0) until the backtest earns it a value:
                                 # it changes the risk profile, so it needs evidence first.

risk:
  max_drawdown_pct: 0.15     # from the episode high-water mark (reset by --resume); liquidate + halt
  max_cumulative_drawdown_pct: 0.25  # from the ALL-TIME high; liquidate + halt until --resume --reset-hwm
  halt_cooldown_days: 20     # after the 15% switch fires, stay flat this many sessions, then resume on our own from a
                             # re-based high-water mark - what the backtest assumes (backtest.py --halt-cooldown-days,
                             # default 20; it fired 3 times in 2023-26). 0 = wait for a manual --resume. --resume still
                             # restarts sooner. The 25% hard floor never clears itself. (2026-11-01, audit 10-31)
  daily_loss_halt_pct: 0.05  # no new entries on a day the account is down this much
  max_daytrades_per_5d: 2

regime:
  enabled: true
  spy_ma_days: 200
  vix_risk_off: 30
  risk_off_scale: 0.5        # multiplier on target_positions when SPY < MA or VIX high
  ladder: false              # true: three states. strong = SPY >= MA x (1 + strong_spy_above_ma_pct) and
                             # VIX < strong_vix_below -> concentrate; neutral = as configured above;
                             # off = SPY < MA or VIX high -> risk_off_scale (or flat, see off_liquidate)
  strong_spy_above_ma_pct: 0.03
  strong_vix_below: 20
  strong_target_positions: 8
  strong_max_position_pct: 0.15
  off_liquidate: false       # true: below the MA exit everything and hold cash (Faber rule). Backtested 2026-09-12
                             # (3y bull market, 29 whipsaw exits): +181%/DD -16.3% vs +247%/-20.5%. The window has
                             # no bear market, which is the only place this rule pays; the premium is measurable,
                             # the payout is not. OFF; revisit if SPY spends a month below its MA. Ladder alone
                             # (8 names/15% cap when strong): +192%/-19.2% - concentration is a wash. OFF.

facts:
  enabled: true
  candidate_pool: 30                 # top-ranked candidates that get a fact sheet before selection
  exclude_earnings_within_days: 5    # CALENDAR days, live and backtest alike. Hard block for candidates
                                     # (needs FINNHUB_API_KEY; a failed lookup blocks too). Backtested
                                     # 2026-09-12 over 3y: 0d +213%, 5d +247%/Sharpe 1.78, 21d +84%,
                                     # 60d blocks the whole universe for two months of three. Trades that
                                     # span a report are 75% of profit - the block only keeps a day-old
                                     # stop from being gapped over. Elevated implied vol still halves size.
  # Dilution block (desk/facts.py candidate_blockers; not a key here): an S-1 or 8-K item 3.02 in the last 90 days
  # hard-blocks a candidate. Backtested 2026-10-17 (scripts/check_offering_block.py; filings from EDGAR for 99.9% of
  # point-in-time membership spells, scripts/build_offering_history.py), 4 starts per window, block vs none:
  #   2018-26 CAGR 7.0% vs 4.9% (better 2/4), 6m excess vs SPY -4.2 vs -4.3pt (worse 3/4), max DD -36% vs -32%
  #   2023-26 CAGR 18.3% vs 18.9% (better 1/4), 6m excess +2.0 vs +3.7pt (worse 4/4), max DD -19.2% vs -18.7%
  # Worse against SPY in 7 of 8 starts and deeper drawdown in 6 of 8, small either way: it does not earn its place
  # in the backtest. Owner's decision 2026-10-17: a flag for the analyst, not a block (offering_block below).
  offering_block: false              # true: an S-1 / 8-K 3.02 in the last 90 days hard-blocks a candidate. false: the
                                     # filing stays on the fact sheet and the analyst decides (REMOVE); the shadow
                                     # book measures those vetoes (analyst_remove)
  iv_over_rv_reduce_at: 1.5          # ATM implied vol / 20d realized vol above this -> half size
  social_z_exclude_at: 3.0           # StockTwits message-rate z-score above this -> block (crowding/pump guard)
  social_enabled: false              # OFF: the z-score needs ~15 sessions of its own history, and an inert
                                     # guard that passes everything is worse than a visibly disabled one.
                                     # Re-enable once state/social_history.json covers most of the pool.
  insider_max_abs_usd: 50000000      # Form 4 rows above this single-fill size are affiliate blocks, not signal
  insider_price_band: 3.0            # rows priced outside [spot/3, spot*3] are currency/ADR-ratio artifacts
  insider_tilt_weight: 0.0           # promotion needs a backtest first; see README
  insider_min_net_usd: 100000
  classifier_model: claude-sonnet-5   # was claude-opus-5 ($0.09 a run). Tags headlines (offering, guidance cut,
                                      # acquisition, legal) - a narrow task; its offering tag can block a buy, so
                                      # watch the monitor's classifier flags for a change after 2026-10-19.

analyst:
  enabled: true
  model: claude-opus-5
  max_web_searches: 5
  candidates_to_review: 15     # >= max_new_entries_per_day (4): entries the analyst has not reviewed are dropped
  reduce_factor: 1.0           # shares kept on an entry the analyst marks REDUCE (floored, min 1 share;
                               # capped at 1.0 in code so it can never enlarge). Was 0.5 until 2026-09-24:
                               # REDUCE hit 10 of the first 19 entries, leaving live at ~52% invested and
                               # 7.8% open risk against a backtest that assumes full size. Not backtestable
                               # (the analyst is not simulated) - it moves live toward the tested config.
                               # 2026-10-03 (audit proposal): 0.85, and 0.75 applied without stacking on the
                               # implied-vol half-size, vs today on point-in-time 2018-26 with REDUCE as a random
                               # cut on 57% and on 90% of entries, 20 paired seeds: each won ~half the seeds and
                               # median drawdown worsened ~1-3pt. Kept. Revisit with 20+ closed trades: does
                               # REDUCE-tagged P&L differ from untagged? If not, retire the sizing arm instead.
                               # 2026-10-17 (23 closed): it does not (-4.6% tagged, n=15, vs -6.2% untagged, n=8).
                               # Same paired-seed design, 0.75 vs 1.0: no cut wins return in 13-17 of 20 seeds in
                               # both windows (2018-26 median 5.2% vs 3.4%/yr) but median drawdown is 1.2-4.5pt
                               # deeper - more exposure, not an edge. Fails the audit's own bar (< ~1pt). Owner's
                               # call: 1.0 from 2026-10-17 - the sizing arm is retired as pre-registered above.
                               # REDUCE is still recorded (thesis, brief) and REMOVE still vetoes; the implied-vol
                               # half-size is unchanged.
  red_team_enabled: true
  red_team_max_web_searches: 2    # was 10, then 5. Each search adds 20-35k input tokens (2026-09-29, monitor
                                  # F-19); 1-2 a run is normal. 2 from 2026-10-17 (engineering review: cost)
  red_team_scope: candidates      # candidates | all. 'all' also wrote bear cases for every holding: 30% of API
                                  # spend, one high-severity case in 18 runs, and a holding's REDUCE is not acted on

audit:
  email: true                  # Saturdays: email the finished audit to report.to (one per audit; audit.py
                               # --email-saved resends a saved one). The report is also in state/audits/
  model: claude-opus-5
  lookback_days: 90            # was 45 until 2026-10-10: at ~10 closed trades per 45 days, trades left the window
                               # about as fast as their post-exit returns matured, so those fields stayed empty.
                               # Measurement only; recent_trades in the prompt is already capped at 40
  post_exit_days: [10, 20]     # trading days after each exit. 20 alone left every field empty for the first month
                               # live (audit 2026-10-03); on ~700 backtest stop-outs 10d and 20d rank trades with
                               # Spearman 0.71, so both are reported rather than one replacing the other

notify:
  webhook_url_env: DESK_WEBHOOK_URL
  webhook_payload_key: text

shadow:                        # desk/shadow.py: every veto, block and half size, replayed against what was bought
  min_closed: 30               # pre-registered: once a group has this many closed brackets and the names it kept out
                               # did at least as well as the names bought, the audit flags it for retirement. Set
                               # 2026-10-17 before any data (engineering review); the owner decides, code never does.

parity:                        # desk/parity.py: the backtest replayed over the live period, in the monitor's report
  enabled: true
  equity_gap_alarm_pts: 5      # SEV2 when live and the replay differ by more than this many percentage points
                               # since the current release began (the full-window gap is reported, not alarmed: it
                               # mostly predates v2.0 and set off the model review every day, 2026-10-20..22).
                               # First run 2026-10-17 (09-12..10-16): live -6.4%, backtest -2.5%, SPY -0.1%; cash
                               # 50% vs 22%; 22 entries matched, 6 backtest-only (3 were the dilution block), 10 live-only

governance:
  stop_rule:                   # quant review 2026-11-01. The desk's alternative is a momentum ETF, not cash: the release
    benchmark: SPMO            # is judged against SPMO (price, Alpaca bars - no dividends on either side) and SPY, from
    warn_on: 2027-04-30        # release.since. REVIEW (owner looks again) on or after warn_on if the desk trails
    warn_trail_pts: 20         # SPMO by > warn_trail_pts; STOP (replace the stock picker with SPMO; owner decides)
    decide_on: 2027-10-29      # on or after decide_on if it trails SPMO by > stop_trail_pts AND trails SPY.
    stop_trail_pts: 15         # Calibrated on v2.1's own backtest (24 starts, 2018-26 and 2023-26): over 7 months it
                               # trails SPMO by > 20pt 8% of the time; over 12 months by > 15pt 19% of the time - the
                               # false-stop rate accepted if the backtest is right. Its median over 12 months is -3.4pt
                               # vs SPMO (+3.9 vs SPY): at best the desk matches the ETF, so the burden is on the desk.
                               # Checked weekly by the audit (audit.stop_rule_status, from parity.since_release).

budget:
  monthly_api_usd: 25          # the monitor raises SEV2 at 80%, SEV1 at 100% (month to date, from telemetry). An alarm,
                               # not a cap. Keep the Anthropic Console limit at or above this: at the Console limit every
                               # role fails and the desk buys nothing (2026-10-17). ~$35/mo before the 2026-10-17 cuts.
                               # 2026-11-01: 40 -> 25. Post-cut telemetry ~$0.64/trading day + the weekly audit = ~$16-18/mo,
                               # so SEV2 ($20) sits above a normal month; 20 would have put SEV2 inside it (audit 10-31).
                               # Target <= ~1.5%/yr of the account until the agents show value; recheck in December.

report:
  to: mark@markwnagel.com   # daily activity email, 14:00 local (after the 13:40 desk run)
                            # Credentials live in .env only: SMTP_HOST/SMTP_USER/SMTP_PASSWORD
                            # (+ optional SMTP_PORT, REPORT_FROM), or RESEND_API_KEY.
                            # With neither set the report is still written to state/reports/.
  summary_model: claude-sonnet-5   # rewrites each buy/sell into two plain sentences for the email.
                                   # Display only - it has no trading authority and never sees a price
                                   # the desk acts on. Blank it to use the structured templates instead.

monitor:                       # agent reliability monitor (monitor.py): runs weekdays before the 14:00 report
  enabled: true
  model: claude-opus-5         # one call a day; first run: 15.6k in, 17.4k out (incl. reasoning), $0.51, 3.2 min
  model_review_weekdays: [4]   # 0=Mon. The model review runs Fridays, on any day a hard alarm fires, and at least weekly;
                               # other days write a rules-only report (hard alarms still run and escalate). Was daily:
                               # $0.63/day, 37% of API spend, 91% of findings SEV3/4 (engineering review 2026-10-17).
  prompt_file: agent-monitor-prompt.md   # its Configuration block is filled from this section at run time
  owner_decisions:             # passed to the model review: deliberate choices it should not flag or try to reverse
    - "2026-10-17: a dilutive filing (S-1, 8-K item 3.02) is a flag for the analyst, not a hard block (facts.offering_block false, backtest 2026-10-17). The parity replay follows the current rules, so names the v1 block kept out appear as gated backtest-only entries by design; that is not a replay defect."
    - "2026-10-17: the red team reviews buy candidates only (analyst.red_team_scope, cost cut); the analyst covers holdings."
    - "2026-10-17: REDUCE is retired (analyst.reduce_factor 1.0)."
    - "2026-10-17: the headline classifier runs on claude-sonnet-5 (cost cut)."
    - "2026-10-17: the cash sweep is not built live; the owner revisits it on 2026-11-06."
    - "2026-10-17: the model review runs Fridays and on hard-alarm days; other days are rules-only."
    - "2026-10-23: the parity alarm judges the gap since the current release; the full-window gap is context."
  owner_resolutions:           # findings the owner has settled; the model review closes each unless new evidence reopens it
    - "F-41 / R-49: verified 2026-10-24 - the audit's first reply was empty, the retry caught it, the second was used."
    - "F-51 / R-59: applied (PR #41) - the same-names gap is split into size and return in parity; the signal-decay rank bug behind most of the return part is fixed."
    - "F-45 / R-53: declined - the replay follows the current rules (owner decision 2026-10-17)."
    - "F-47 / R-55: not a defect - AVTR's two 8-K rows were two separate SEC filings."
    - "F-38 / R-44: not pursued - each headline the roles see already carries its [source]."
    - "F-31 / R-45: covered - web-only cases are capped at 0.5 and undated pages count as no evidence; a search with no citation means no web claim was made."
    - "F-44: resolved - model id and price basis are on every llm_call since PR #38."
    - "F-46: resolved - the classifier prompt defines insiders as Form 4 filers (PR #36)."
    - "F-49: resolved - red team scope is policy (owner decision 2026-10-17); the skip is logged."
    - "F-40 / R-48: addressed - usage-limit refusals are outcome api_access (PR of 2026-10-29) and alarm SEV1; spend alarms at 80%/100%; the November threshold is on the 11-06 review."
    - "F-30 / R-41: measured - the classifier now counts unrelated headlines (cls_unrelated_headlines, feed news_classified); judge the filter's leak from that."
    - "F-33 / R-40: measured - earnings_date_conflict flags a next report within 45 days of the last results 8-K."
    - "R-42: applied - summarizer calls carry trades and input_chars."
  window_hours: 24             # first run only; afterwards the window is "since the previous monitor run"
  baseline_days: 7
  agents:                      # SLOs are set only where a real contract exists; the rest is baseline-only
    - name: desk-job
      purpose: Daily trading pipeline (run_daily.py) - sync with the broker, risk governor, rank, fact-check, AI review, place orders and protective stops, write the brief.
      code_location: /Users/mark/TeamRobo/run_daily.py, desk/
      owner: mark@markwnagel.com
      expected_output: run_end status ok, skipped (market holiday) or halted for every scheduled weekday slot; the day's brief in state/briefs; no 'protection UNVERIFIED' notes.
      slos: {task_success_rate: "every scheduled trading day (a missed day delays exits and the kill switch)", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: "n/a"}
    - name: headline-classifier
      purpose: Classify each candidate's recent headlines (tone; offering, guidance-cut, takeover, legal flags). Veto-side only.
      code_location: desk/facts.py classify_headlines
      owner: mark@markwnagel.com
      expected_output: one result per requested symbol, schema-valid JSON.
      slos: {task_success_rate: "none - baseline only", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: 1}
    - name: red-team
      purpose: Strongest bear case per buy candidate, with trap type and severity in [0, 1]. Scope is candidates only by
        policy (analyst.red_team_scope, 2026-10-17 cost cut) - holdings are reviewed by the analyst with their fact sheets.
        On a day with no candidates it is not called and records agent_output skipped (not a failure).
      code_location: desk/analyst.py red_team
      owner: mark@markwnagel.com
      expected_output: one case per requested symbol; trap_type from the enum; severity within [0, 1].
      slos: {task_success_rate: "none - baseline only", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: 6}
    - name: analyst
      purpose: Veto-only review - KEEP, REMOVE or REDUCE per symbol with a reason; a brief for the owner.
      code_location: desk/analyst.py review, apply_verdicts
      owner: mark@markwnagel.com
      expected_output: a verdict for every requested symbol and none for others; brief at most 150 words; never an ADD or a size increase.
      slos: {task_success_rate: "none - baseline only", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: 6}
    - name: report-summarizer
      purpose: One or two plain-English sentences per trade in the daily email.
      code_location: desk/report.py plain_summaries
      owner: mark@markwnagel.com
      expected_output: a summary for every trade, at most 2 sentences / 45 words; template fallback only on failure.
      slos: {task_success_rate: "none - baseline only", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: 1}
    - name: daily-report
      purpose: The 14:00 weekday email (report_daily.py).
      code_location: /Users/mark/TeamRobo/report_daily.py, desk/report.py, desk/report_html.py
      owner: mark@markwnagel.com
      expected_output: run_end status ok with email sent, every scheduled weekday.
      slos: {task_success_rate: "every scheduled weekday", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: "n/a"}
    - name: weekly-auditor
      purpose: Saturday process audit (audit.py) - proposes at most 3 config changes, never edits config.
      code_location: /Users/mark/TeamRobo/audit.py
      owner: mark@markwnagel.com
      expected_output: one run per week (runs when the Mac next wakes after Saturday); at most 3 proposed changes.
      slos: {task_success_rate: "one run every 8 days or fewer", p95_latency: "none - baseline only", cost_per_task: "none - baseline only", max_turns: 6}

backtest:
  prior_untracked_trials: 63   # Every variant counts toward the Deflated Sharpe's N: a result picked from many tries
                               # must clear a higher bar. Not in state/history/trials.jsonl (counted 2026-10-17,
                               # engineering review): the $5M-volume universe (2026-09-12) 1; robustness.py 09-24
                               # design 4 + sensitivity 24; 10-03 audit check 4; 10-13 stop variants 3 (2.5x ATR was
                               # already a sensitivity run); 10-17 audit check 3 (decay 20 and 30, reduce 1.0); 10-16
                               # studies of the desk as a sleeve 8 and sector-ETF rotation rules 16. N 20 -> 83 moves
                               # the current config's Deflated Sharpe from 0.955 to 0.937, just under the 0.95 bar.
                               # From here robustness.log_variant_trials() logs the check scripts' variants; a re-run
                               # of a script counted above is then counted twice, which errs on the strict side.
